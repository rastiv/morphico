<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>morphico — preview</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #e8e8ea; --dim: #7a7a86; --faint: #2c2c36; --accent: #7aa2ff;
    --bg: #121216; --panel: #1b1b22; --raised: #23232c; --stroke: #e8e8ea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-bottom: 1px solid var(--faint); }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.02em; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 6px 16px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--raised); color: var(--fg); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; max-width: 1100px; margin: 0 auto; padding: 24px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; padding: 16px; } }
  .workspace { display: grid; gap: 18px; justify-items: center; align-content: start; min-width: 0; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chips button { padding: 5px 14px; border: 1px solid var(--faint); border-radius: 999px; background: transparent; color: var(--dim); font-weight: 600; cursor: pointer; }
  .chips button.active { border-color: var(--accent); background: var(--accent); color: var(--bg); }

  .stage { width: min(360px, 100%); aspect-ratio: 1; background: var(--panel); border-radius: 18px; color: var(--stroke); }
  .stage svg { width: 100%; height: 100%; overflow: visible; }
  #grid-layer { display: none; stroke: var(--dim); }
  .show-grid #grid-layer { display: inline; }
  #debug-layer { display: none; }
  .debugging #debug-layer { display: inline; }
  .debugging #morph-path { stroke: transparent; fill: none; }

  .states { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .states button { width: 44px; height: 44px; padding: 8px; border: 1px solid var(--faint); border-radius: 10px; background: var(--panel); color: var(--dim); font-size: 18px; cursor: pointer; }
  .states button.active { border-color: var(--accent); color: var(--fg); }
  .states button.not-drawn { border-style: dashed; }
  .states svg { width: 100%; height: 100%; overflow: visible; }
  .progress { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: min(360px, 100%); }

  .card { display: grid; gap: 14px; justify-items: center; width: 100%; padding: 20px; background: var(--panel); border-radius: 16px; }
  .card h2 { justify-self: start; margin: 0; color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .text-line { display: flex; align-items: center; min-height: 48px; max-width: 100%; overflow: hidden; color: var(--stroke); }

  aside { display: grid; gap: 14px; align-content: start; }
  .panel { padding: 14px 16px; background: var(--panel); border-radius: 14px; }
  .panel h2 { margin: 0 0 10px; color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .rows { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 10px 10px; align-items: center; }
  .rows label:first-child, .rows > label { color: var(--dim); }
  .disabled { opacity: 0.4; pointer-events: none; }
  input[type=range], select { width: 100%; }
  select { padding: 4px 6px; border: 1px solid var(--faint); border-radius: 6px; background: var(--bg); }
  input[type=text] { width: 100%; padding: 5px 8px; border: 1px solid var(--faint); border-radius: 6px; background: var(--bg); font: 15px ui-monospace, monospace; }
  output { min-width: 4.5ch; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .reset { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--accent); cursor: pointer; visibility: hidden; }
  .reset.visible { visibility: visible; }
  .reset:hover { background: var(--raised); }
  /* style rows: the last column only holds the ↺ buttons, values sit next to their slider */
  .style-rows { grid-template-columns: 88px minmax(0, 1fr) 22px; }
  .slider { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .slider input { flex: 1; min-width: 0; }

  .segmented { display: flex; padding: 2px; gap: 2px; background: var(--bg); border-radius: 8px; }
  .segmented button { flex: 1; min-width: 0; padding: 4px 2px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); font-size: 12.5px; cursor: pointer; }
  .segmented button.active { background: var(--raised); color: var(--fg); }

  .colors { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .colors button { width: 20px; height: 20px; padding: 0; border: 2px solid transparent; border-radius: 50%; background: var(--swatch); cursor: pointer; }
  .colors button.active { border-color: var(--fg); box-shadow: 0 0 0 2px var(--panel) inset; }
  .colors input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--faint); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .checks { display: grid; gap: 6px; }
  .checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }

  .hint { margin: 10px 0 0; color: var(--dim); font-size: 12px; }
  details summary { color: var(--dim); cursor: pointer; }
  pre { margin: 8px 0 0; max-height: 160px; overflow: auto; color: var(--dim); font-size: 11px; white-space: pre-wrap; word-break: break-all; }
  .error { color: #ff7a7a; }
</style>
</head>
<body>
<header>
  <h1>morphico</h1>
  <nav class="tabs" id="tabs" aria-label="Preview">
    <button data-tab="digits">Digits</button>
    <button data-tab="icons">Icons</button>
  </nav>
</header>

<div class="layout">
  <main class="workspace">
    <div class="chips" id="set-buttons" role="group" aria-label="Set"></div>

    <div class="stage">
      <svg viewBox="0 0 24 24" fill="none">
        <g id="grid-layer"></g>
        <path id="morph-path" stroke="currentColor"/>
        <g id="debug-layer"></g>
      </svg>
    </div>

    <div class="states" id="state-buttons"></div>

    <div class="progress">
      <label for="progress">Progress</label>
      <input id="progress" type="range" min="0" max="1" step="0.001" value="1">
      <output id="progress-output">1.00</output>
    </div>

    <section class="card" id="text-preview" aria-label="Text line">
      <h2>Text line — <code>text()</code></h2>
      <div class="text-line" id="text-line"></div>
      <div class="rows" style="width: min(420px, 100%)">
        <label for="text-input">Text</label>
        <input id="text-input" type="text" value="12:09:02" maxlength="16" spellcheck="false">
        <span></span>

        <label for="cell-width">Cell width</label>
        <input id="cell-width" type="range" min="6" max="24" step="0.5" value="10">
        <output id="cell-width-output">10</output>

        <label for="spacing">Spacing</label>
        <input id="spacing" type="range" min="-3" max="6" step="0.25" value="4">
        <output id="spacing-output">4</output>

        <label for="text-size">Size</label>
        <input id="text-size" type="range" min="24" max="160" step="4" value="72">
        <output id="text-size-output">72px</output>
      </div>
      <label><input id="live-clock" type="checkbox"> Live clock</label>
    </section>
  </main>

  <aside>
    <section class="panel">
      <h2>Motion</h2>
      <div class="rows">
        <label for="duration">Duration</label>
        <input id="duration" type="range" min="100" max="3000" step="50" value="600">
        <output id="duration-output">600ms</output>

        <label for="easing">Easing</label>
        <select id="easing"></select>
        <span></span>
      </div>
      <div class="checks" style="margin-top: 10px">
        <label><input id="auto-play" type="checkbox"> Auto-play (step through the states)</label>
      </div>
    </section>

    <section class="panel">
      <h2>Style</h2>
      <div class="rows style-rows">
        <label for="color">Color</label>
        <div class="colors" id="color-swatches">
          <input id="color" type="color" value="#e8e8ea" title="Custom color">
        </div>
        <span></span>

        <label for="stroke-width">Stroke width</label>
        <span class="slider"><input id="stroke-width" type="range" min="0.25" max="4" step="0.05"><output id="stroke-width-output"></output></span>
        <button class="reset" data-reset="strokeWidth" title="Back to the set's own">↺</button>

        <label title="Grid units scale with the icon; px stays the same at any size">Width in</label>
        <div class="segmented" id="stroke-unit"></div>
        <span></span>

        <label>Line cap</label>
        <div class="segmented" id="line-cap"></div>
        <button class="reset" data-reset="lineCap" title="Back to the set's own">↺</button>

        <label id="line-join-label">Line join</label>
        <div class="segmented" id="line-join"></div>
        <button class="reset" data-reset="lineJoin" title="Back to the set's own">↺</button>

        <label>Fill</label>
        <div class="segmented" id="fill"></div>
        <span></span>
      </div>
      <div class="rows style-rows" id="roundness-row" style="margin-top: 10px">
        <label for="roundness">Roundness</label>
        <span class="slider"><input id="roundness" type="range" min="0" max="1" step="0.05"><output id="roundness-output"></output></span>
        <button class="reset" data-reset="roundness" title="Back to the icon's own corners">↺</button>
      </div>
      <p class="hint" id="line-join-hint">Line join only changes sharp corners: for icons, set the roundness to 0.</p>
    </section>

    <section class="panel">
      <h2>Inspect</h2>
      <div class="checks">
        <label><input id="show-grid" type="checkbox"> Grid</label>
        <label><input id="show-debug" type="checkbox"> Segments &amp; control points</label>
      </div>
      <details style="margin-top: 10px">
        <summary>Path data</summary>
        <pre id="path-output"></pre>
      </details>
    </section>
  </aside>
</div>

<!-- TypeScript, served as JavaScript by tools/serve.ts (npm run dev) -->
<script type="module" src="preview/main.ts"></script>
</body>
</html>
