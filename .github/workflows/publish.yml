# Publishes to npm when a version tag (v1.2.3) is pushed — only after the CI checks pass.
# Authentication: npm Trusted Publishing (OIDC, no token or secret). Configured on npmjs.com:
# package morphico → Settings → Trusted Publisher → GitHub Actions, rastiv/morphico, publish.yml.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # npm publish runs the prepublishOnly script first: typecheck + build
      - run: npm publish --access public
